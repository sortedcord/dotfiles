# Helium flags for Motobook 60 (Core Ultra 5 225H, Intel Arc iGPU, niri/Wayland)
# Read by helium-wrapper after /etc/helium-browser-flags.conf. Keep all flags
# here; only ONE --enable-features line may exist across both files (the last
# one wins).

# Wayland IME (the wrapper already passes --ozone-platform=wayland)
--enable-wayland-ime

# Zero-copy tile uploads (helium://gpu: "Tile Update Mode: Zero-copy")
--enable-zero-copy

# VA-API decode/encode on the Arc iGPU (verified: VaapiVideoDecoder, AV1 1080p)
# plus touchpad swipe history navigation (needed for the page-slide swipe).
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,TouchpadOverscrollHistoryNavigation,WaylandUnscaledTouchpadScrolling

# niri is not a recognised desktop, so pick the keyring explicitly (gnome-keyring)
--password-store=gnome-libsecret

# Removed (2026-11-11):
#   --ignore-gpu-blocklist        no blocklist entry matches Mesa 26 / Arrow Lake
#   --enable-gpu-rasterization    already the default
#   WebMachineLearningNeuralNetwork  experimental, unused
