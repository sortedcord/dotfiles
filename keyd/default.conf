[ids]
*
# RK N80 (Bluetooth): keep its original key behavior.
-046d:b35a

[main]
capslock = layer(control)
leftcontrol = capslock
leftmeta = layer(alt)
leftalt = layer(meta)

# Tab: tap = Tab, hold = tabnav layer (h/j/k/l = arrows). If another key goes down
# within 60 ms, Tab is sent at once (so Tab+Mod reaches niri as Tab then Mod).
# Keep in sync with rkn80.conf.
tab = timeout(tab, 60, overload(tabnav, tab))

[tabnav]
h = left
j = down
k = up
l = right
