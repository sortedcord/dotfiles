[ids]
*
# RK N80 (Bluetooth): keep its original key behavior.
-046d:b35a

[main]
capslock = layer(control)
leftcontrol = capslock
leftmeta = layer(alt)
leftalt = layer(meta)

# Tab: tap = Tab, hold = tabnav layer (h/j/k/l = arrows).
# Keep in sync with rkn80.conf.
tab = overload(tabnav, tab)

[tabnav]
h = left
j = down
k = up
l = right
